<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グローバル地震マッピングシステム v4.3 (震度フィルター対応)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #333333;
            --border-color: #e0e0e0;
            --accent-color: #667eea;
        }

        html[data-theme="dark"] {
            --bg-primary: #1e1e2e;
            --bg-secondary: #2d2d44;
            --text-primary: #e0e0e0;
            --border-color: #404050;
            --accent-color: #7c8fef;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 10px;
            transition: background 0.3s;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: var(--bg-primary);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .header-buttons { display: flex; gap: 10px; }
        button { padding: 8px 15px; border: none; border-radius: 5px; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-size: 14px; }
        button:hover { background: rgba(255,255,255,0.3); }

        .controls {
            padding: 10px 15px;
            background: var(--bg-secondary);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            align-items: end;
        }

        select {
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
        }

        .intensity-filter-panel {
            padding: 12px 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .intensity-label {
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .checkbox-label input {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .search-button {
            padding: 8px 20px !important;
            background: var(--accent-color) !important;
            color: white !important;
            font-weight: bold;
            border-radius: 5px !important;
            margin-left: auto;
            font-size: 14px !important;
        }

        .search-button:hover {
            background: #5568d3 !important;
        }

        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0;
            padding: 0;
            flex: 1;
            overflow: auto;
        }

        .map-container {
            height: calc(100vh - 200px);
            position: relative;
            border-radius: 0;
            overflow: hidden;
            background: var(--bg-secondary);
            grid-column: 1;
            min-height: 500px;
        }

        #map { 
            height: 100%; 
            width: 100%;
            z-index: 1; 
        }

        .content {
            grid-column: 1;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 0;
            padding: 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .info { 
            background: transparent; 
            padding: 0 20px 0 0; 
            border-radius: 0; 
            grid-column: 1;
        }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stats-item { background: var(--bg-primary); padding: 12px; border-radius: 5px; text-align: center; }
        .stats-item h3 { font-size: 14px; margin-bottom: 5px; }
        .stats-item .value { font-size: 22px; font-weight: bold; color: var(--accent-color); }

        .sidebar { 
            grid-column: 2; 
            padding-left: 20px; 
            border-left: 1px solid var(--border-color);
            overflow-y: auto;
            max-height: 400px;
        }

        .earthquake-item { background: var(--bg-primary); padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; border-left: 4px solid var(--accent-color); }
        .earthquake-item .magnitude { font-weight: bold; color: var(--accent-color); }

        .menu { position: fixed; top: 40px; right: 30px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; min-width: 200px; display: none; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .menu.active { display: block; }
        .menu a { display: block; padding: 10px 15px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); text-decoration: none; }
        .menu a:last-child { border-bottom: none; }
        .menu a:hover { background: var(--bg-secondary); }
    </style>
</head>

        <div class="intensity-filter-panel">

            <label class="checkbox-label">

            <label class="checkbox-label">

            <label class="checkbox-label">

            <label class="checkbox-label">

            <label class="checkbox-label">

            </label>
            <button class="search-button" onclick="applyFilters()">🔍 検索</button>
        </div>

        <div class="main-wrapper">
            <div class="map-container">
                <div id="map"></div>
            </div>

            <div class="content">
                <div class="info">
                    <div class="stats">

                        </div>
                        <div class="stats-item">

                    </div>
                </div>

                <div class="sidebar" id="sidebar"></div>
            </div>
        </div>

        function initMap() {
            map = L.map('map').setView([37.5, 138], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);
            
            setupFilters();
            displayAllEarthquakes();
        }

        function setupFilters() {
            const years = new Set();
            earthquakeData.forEach(q => {
                const year = q.date.split('/')[0];
                years.add(year);
            });
            
            const yearSelect = document.getElementById('yearFilter');
            Array.from(years).sort((a, b) => a - b).forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                opt.text = year + '年';
                yearSelect.appendChild(opt);
            });

            const prefectures = new Set();
            earthquakeData.forEach(q => {
                if (q.country === 'Japan') {
                    const match = q.location.match(/^([^県市]+[県市])/);
                    if (match) prefectures.add(match[1]);
                }
            });
            
            const prefSelect = document.getElementById('prefectureFilter');
            Array.from(prefectures).sort().forEach(pref => {
                const opt = document.createElement('option');
                opt.value = pref;
                opt.text = pref;
                prefSelect.appendChild(opt);
            });
        }

        function getSelectedIntensities() {
            const checkboxes = document.querySelectorAll('input[name="intensity"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }

        function updateUI() {
            // selectが変わった時は即座に表示を変更しない（検索ボタン待ち）
        }

        function applyFilters() {
            const region = document.getElementById('regionFilter').value;
            const magnitude = document.getElementById('magnitudeFilter').value;
            const prefecture = document.getElementById('prefectureFilter').value;
            const year = document.getElementById('yearFilter').value;
            const month = document.getElementById('monthFilter').value;
            const moon = document.getElementById('moonFilter').value;
            const intensities = getSelectedIntensities();

            filteredData = earthquakeData.filter(q => {
                if (region && q.country !== region) return false;
                if (magnitude === 'M5+' && q.magnitude < 5) return false;
                if (magnitude === 'M6+' && q.magnitude < 6) return false;
                if (magnitude === 'M7+' && q.magnitude < 7) return false;
                if (prefecture && !q.location.includes(prefecture)) return false;
                if (year && !q.date.startsWith(year)) return false;
                if (month && q.date.split('/')[1] !== month.padStart(2, '0')) return false;
                if (moon && q.moon_phase !== moon) return false;
                if (intensities.length > 0 && !intensities.includes(q.intensity)) return false;
                return true;
            });

            displayEarthquakes(filteredData);
            updateStats();
        }

        function displayAllEarthquakes() {
            displayEarthquakes(earthquakeData);
            updateStats();
        }

        function displayEarthquakes(data) {
            // 既存マーカー削除
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            const colorMap = {
                '７': '#8b0000',
                '６強': '#dc143c',
                '６弱': '#ff6347',
                '５強': '#ff8c00',
                '５弱': '#ffa500',
                '５': '#ffa500'
            };

            data.forEach(q => {
                const intensity = q.intensity.trim();
                const color = colorMap[intensity] || '#87ceeb';
                
                const marker = L.circleMarker([q.latitude, q.longitude], {
                    radius: 5 + q.magnitude,
                    fillColor: color,
                    color: '#000',
                    weight: 1,
                    opacity: 0.8,
                    fillOpacity: 0.7
                }).addTo(map);

                marker.bindPopup(`
                    <b>${q.location}</b><br>
                    日時: ${q.date}<br>
                    M: ${q.magnitude}<br>
                    震度: ${q.intensity}<br>
                    深さ: ${q.depth}km<br>
                    死者: ${q.deaths}人<br>
                    経済損失: $${q.economic_loss_usd.toLocaleString()}
                `);

                markers.push(marker);
            });

            updateSidebar(data.slice(0, 20));
        }

        function updateSidebar(data) {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '<h3 style="margin-bottom: 10px;">📋 最新20件</h3>';
            data.forEach(q => {
                const item = document.createElement('div');
                item.className = 'earthquake-item';
                item.innerHTML = `
                    <div><b>${q.date}</b></div>
                    <div>${q.location}</div>
                    <div class="magnitude">M${q.magnitude} 震度${q.intensity}</div>
                `;
                sidebar.appendChild(item);
            });
        }

        function updateStats() {
            const count = filteredData.length;
            const avgMag = count > 0 ? (filteredData.reduce((s, q) => s + q.magnitude, 0) / count).toFixed(1) : '0.0';
            document.getElementById('count').textContent = count;
            document.getElementById('avgMag').textContent = avgMag;
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        function toggleMenu() {
            const menu = document.getElementById('menu');
            menu.classList.toggle('active');
        }

        function showPrivacy() {
            alert('プライバシーポリシー\n\nこのアプリケーションは、気象庁の地震データを基に作成されています。個人情報は収集されていません。');
            toggleMenu();
        }

        // テーマ読み込み
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // 初期化
        window.addEventListener('load', initMap);
    </script>
