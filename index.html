<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グローバル地震マッピングシステム v4.1 (月齢対応)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #333333;
            --border-color: #e0e0e0;
            --accent-color: #667eea;
        }

        html[data-theme="dark"] {
            --bg-primary: #1e1e2e;
            --bg-secondary: #2d2d44;
            --text-primary: #e0e0e0;
            --border-color: #404050;
            --accent-color: #7c8fef;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 10px;
            transition: background 0.3s;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: var(--bg-primary);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .controls {
            padding: 20px;
            background: var(--bg-secondary);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .map-container {
            height: 500px;
            position: relative;
        }

        #map { height: 100%; z-index: 1; }

        .content {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            padding: 20px;
        }

        .info { background: var(--bg-secondary); padding: 20px; border-radius: 10px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stats-item { background: var(--bg-primary); padding: 12px; border-radius: 5px; text-align: center; }

        .sidebar {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 10px;
            height: fit-content;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-section h3 {
            color: var(--accent-color);
            margin-bottom: 12px;
            font-size: 16px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }

        .checkbox-label:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .checkbox-label input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .checkbox-text {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }

        .button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .button:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .footer {
            background: var(--bg-secondary);
            padding: 20px;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
        }

        @media (max-width: 1024px) {
            .content { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>

    <div class="container">
        <div class="header">
            <div>
                <h1>🌍 グローバル地震マッピングシステム</h1>
                <p>v4.1 月齢対応版 | 1995-2026 | 438件のデータ</p>
            </div>

                <select id="regionFilter">

                    <option value="international">海外</option>

            <div class="control-group">

        <div class="map-container" id="map"></div>

        <div class="content">
            <div class="info">
                <h2>📊 統計</h2>
                <div class="stats">
                    <div class="stats-item">
                        <div style="font-size: 12px;">表示中</div>
                        <div style="font-size: 20px; font-weight: bold; color: var(--accent-color);">

                <p style="font-size: 13px; margin-top: 15px;">
                    🌙 各地震の月相データを含みます。サイドバーで月齢フィルタが利用できます。
                </p>
            </div>

            <div class="sidebar">
                <div class="sidebar-section">
                    <h3>🌙 月齢フィルタ</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filterNewMoon" checked>

                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filterFullMoon" checked>
                        <span class="checkbox-text">🌕満月 (<span id="fullMoonCount">0</span>)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="filterHalfMoon" checked>
                        <span class="checkbox-text">🌓半月 (<span id="halfMoonCount">0</span>)</span>
                    </label>
                    <button class="button" id="resetMoonFilter" style="margin-top: 10px;">🔄リセット</button>
                </div>

                <div class="sidebar-section">
                    <h3>📈 全体統計</h3>
                    <div style="font-size: 12px; line-height: 1.8;">
                        <p>🌑新月: 53件 (12.1%)</p>
                        <p>🌕満月: 49件 (11.2%)</p>
                        <p>🌓半月: 168件 (38.4%)</p>
                        <p>その他: 168件 (38.3%)</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            📊 データ出典: 気象庁 | 🌙 月齢計算アルゴリズム対応 | 📅 更新: 2026-09-29
        </div>
    </div>

        let moonFilterSettings = {
            '新月': true,
            '満月': true,
            '半月': true
        };

        // マップ初期化
        function initMap() {
            map = L.map('map').setView([35, 138], 5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);

            updateMarkers();
            updateMoonCounts();
        }

        // 月齢統計更新
        function updateMoonCounts() {
            const newMoonCount = earthquakeData.filter(eq => eq.moon_phase === '新月').length;
            const fullMoonCount = earthquakeData.filter(eq => eq.moon_phase === '満月').length;
            const halfMoonCount = earthquakeData.filter(eq => eq.moon_phase === '半月').length;

            document.getElementById('newMoonCount').textContent = newMoonCount;
            document.getElementById('fullMoonCount').textContent = fullMoonCount;
            document.getElementById('halfMoonCount').textContent = halfMoonCount;
        }

        // マーカー更新
        function updateMarkers() {
            allMarkers.forEach(m => map.removeLayer(m));
            allMarkers = [];

            const region = document.getElementById('regionFilter').value;
            const mag = parseFloat(document.getElementById('magFilter').value) || 0;

            let count = 0;
            earthquakeData.forEach(eq => {
                // フィルタ適用
                if (region === 'domestic' && eq.country !== 'Japan') return;
                if (region === 'international' && eq.country === 'Japan') return;
                if (eq.magnitude < mag) return;

                // 月齢フィルタ
                const moonPhase = eq.moon_phase || '不明';
                if (!moonFilterSettings[moonPhase]) return;

                // マーカーサイズ・色
                const size = eq.magnitude >= 8 ? 12 : eq.magnitude >= 7 ? 10 : eq.magnitude >= 6 ? 8 : 6;
                const color = eq.magnitude >= 8 ? '#FF0000' : eq.magnitude >= 7 ? '#FF6600' : 
                             eq.magnitude >= 6 ? '#FFCC00' : '#00CCFF';

                // ポップアップ
                const popup = `
                    <div style="font-size: 12px;">
                        <strong>${eq.location}</strong><br>
                        📅 ${eq.date}<br>
                        M${eq.magnitude} | 深さ: ${eq.depth}km<br>
                        <strong>震度: ${eq.intensity}</strong><br>
                        🌙 月相: ${moonPhase} (${eq.moon_age}日)
                    </div>
                `;

                const marker = L.circleMarker([eq.latitude, eq.longitude], {
                    radius: size,
                    fillColor: color,
                    color: '#000',
                    weight: 1,
                    opacity: 0.8,
                    fillOpacity: 0.6
                }).bindPopup(popup).addTo(map);

                allMarkers.push(marker);
                count++;
            });

            document.getElementById('markerCount').textContent = count;
        }

        // イベントリスナー
        document.getElementById('regionFilter').addEventListener('change', updateMarkers);
        document.getElementById('magFilter').addEventListener('change', updateMarkers);

        document.getElementById('filterNewMoon').addEventListener('change', function() {
            moonFilterSettings['新月'] = this.checked;
            updateMarkers();
        });

        document.getElementById('filterFullMoon').addEventListener('change', function() {
            moonFilterSettings['満月'] = this.checked;
            updateMarkers();
        });

        document.getElementById('filterHalfMoon').addEventListener('change', function() {
            moonFilterSettings['半月'] = this.checked;
            updateMarkers();
        });

        document.getElementById('resetMoonFilter').addEventListener('click', function() {
            document.getElementById('filterNewMoon').checked = true;
            document.getElementById('filterFullMoon').checked = true;
            document.getElementById('filterHalfMoon').checked = true;
            moonFilterSettings = { '新月': true, '満月': true, '半月': true };
            updateMarkers();
        });

        // 初期化
        window.addEventListener('load', initMap);
    </script>
</body>
</html>
